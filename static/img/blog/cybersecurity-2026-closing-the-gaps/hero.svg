<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="0.55" stop-color="#142233"/>
      <stop offset="1" stop-color="#1B2D44"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2684FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2684FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.75" cy="0.65" r="0.5">
      <stop offset="0" stop-color="#4C9AFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4C9AFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2684FF"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Defensive wall with gap -->
  <g transform="translate(0 0)">
    <!-- Bricks rows -->
    <g fill="url(#brickFill)" stroke="#6FB3FF" stroke-width="1.5" opacity="0.9">
      <!-- row 1 -->
      <rect x="180"  y="180" width="100" height="50" rx="4"/>
      <rect x="290"  y="180" width="100" height="50" rx="4"/>
      <rect x="400"  y="180" width="100" height="50" rx="4"/>
      <!-- GAP between 510-700 -->
      <rect x="710"  y="180" width="100" height="50" rx="4"/>
      <rect x="820"  y="180" width="100" height="50" rx="4"/>
      <rect x="930"  y="180" width="100" height="50" rx="4"/>

      <!-- row 2 -->
      <rect x="235"  y="240" width="100" height="50" rx="4"/>
      <rect x="345"  y="240" width="100" height="50" rx="4"/>
      <rect x="455"  y="240" width="100" height="50" rx="4"/>
      <rect x="655"  y="240" width="100" height="50" rx="4"/>
      <rect x="765"  y="240" width="100" height="50" rx="4"/>
      <rect x="875"  y="240" width="100" height="50" rx="4"/>

      <!-- row 3 -->
      <rect x="180"  y="300" width="100" height="50" rx="4"/>
      <rect x="290"  y="300" width="100" height="50" rx="4"/>
      <rect x="400"  y="300" width="100" height="50" rx="4"/>
      <rect x="710"  y="300" width="100" height="50" rx="4"/>
      <rect x="820"  y="300" width="100" height="50" rx="4"/>
      <rect x="930"  y="300" width="100" height="50" rx="4"/>

      <!-- row 4 -->
      <rect x="235"  y="360" width="100" height="50" rx="4"/>
      <rect x="345"  y="360" width="100" height="50" rx="4"/>
      <rect x="455"  y="360" width="100" height="50" rx="4"/>
      <rect x="655"  y="360" width="100" height="50" rx="4"/>
      <rect x="765"  y="360" width="100" height="50" rx="4"/>
      <rect x="875"  y="360" width="100" height="50" rx="4"/>
    </g>

    <!-- Gap highlight -->
    <rect x="510" y="170" width="190" height="250" fill="none" stroke="#FF7A45" stroke-width="3" stroke-dasharray="8 6" rx="6" opacity="0.55"/>

    <!-- New brick filling the gap (animated-look) -->
    <g>
      <rect x="565" y="265" width="100" height="50" rx="4" fill="#6FB3FF" stroke="#fff" stroke-width="2.5" opacity="0.95"/>
      <text x="615" y="298" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="#0D1B2A" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Shield watermark behind -->
  <g transform="translate(600 320)" opacity="0.06">
    <path d="M0 -180 L160 -120 L160 50 C160 140 80 200 0 220 C-80 200 -160 140 -160 50 L-160 -120 Z" fill="#fff"/>
  </g>

  <text x="600" y="540" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="26" fill="#9ec5ff" text-anchor="middle" letter-spacing="5">CLOSING THE GAPS</text>
</svg>
