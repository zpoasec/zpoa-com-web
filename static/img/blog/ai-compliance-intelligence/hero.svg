<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="0.55" stop-color="#142233"/>
      <stop offset="1" stop-color="#1B2D44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2684FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2684FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2684FF"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- AI Chip on left -->
  <g transform="translate(330 340)">
    <!-- Pins -->
    <g stroke="#4C9AFF" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="-115" y1="-60" x2="-150" y2="-60"/>
      <line x1="-115" y1="-30" x2="-150" y2="-30"/>
      <line x1="-115" y1="0" x2="-150" y2="0"/>
      <line x1="-115" y1="30" x2="-150" y2="30"/>
      <line x1="-115" y1="60" x2="-150" y2="60"/>
      <line x1="115" y1="-60" x2="150" y2="-60"/>
      <line x1="115" y1="-30" x2="150" y2="-30"/>
      <line x1="115" y1="0" x2="150" y2="0"/>
      <line x1="115" y1="30" x2="150" y2="30"/>
      <line x1="115" y1="60" x2="150" y2="60"/>
      <line x1="-60" y1="-115" x2="-60" y2="-150"/>
      <line x1="-30" y1="-115" x2="-30" y2="-150"/>
      <line x1="0" y1="-115" x2="0" y2="-150"/>
      <line x1="30" y1="-115" x2="30" y2="-150"/>
      <line x1="60" y1="-115" x2="60" y2="-150"/>
      <line x1="-60" y1="115" x2="-60" y2="150"/>
      <line x1="-30" y1="115" x2="-30" y2="150"/>
      <line x1="0" y1="115" x2="0" y2="150"/>
      <line x1="30" y1="115" x2="30" y2="150"/>
      <line x1="60" y1="115" x2="60" y2="150"/>
    </g>
    <!-- Chip body -->
    <rect x="-115" y="-115" width="230" height="230" rx="18" fill="url(#chipFill)" stroke="#6FB3FF" stroke-width="2"/>
    <!-- AI text -->
    <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="68" fill="#fff" text-anchor="middle" letter-spacing="2">AI</text>
  </g>

  <!-- Connecting flow -->
  <g stroke="#4C9AFF" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M510 340 L690 340" stroke-dasharray="8 8"/>
    <polygon points="690,330 712,340 690,350" fill="#6FB3FF" stroke="none"/>
  </g>

  <!-- Compliance document on right -->
  <g transform="translate(820 340)">
    <rect x="-110" y="-150" width="220" height="290" rx="14" fill="#162B45" stroke="#2A4060" stroke-width="2"/>
    <rect x="-110" y="-150" width="220" height="46" rx="14" fill="#0052CC"/>
    <rect x="-110" y="-115" width="220" height="11" fill="#0052CC"/>
    <!-- Checklist rows: 3 done, 2 pending -->
    <g transform="translate(-86 -80)">
      <g transform="translate(0 0)">
        <circle cx="12" cy="12" r="12" fill="#00B894"/>
        <path d="M6 12 L10 16 L18 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="34" y="7" width="140" height="6" rx="3" fill="#d4dae2" opacity="0.85"/>
        <rect x="34" y="19" width="100" height="5" rx="2.5" fill="#9aa6b8" opacity="0.5"/>
      </g>
      <g transform="translate(0 50)">
        <circle cx="12" cy="12" r="12" fill="#00B894"/>
        <path d="M6 12 L10 16 L18 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="34" y="7" width="130" height="6" rx="3" fill="#d4dae2" opacity="0.85"/>
        <rect x="34" y="19" width="90" height="5" rx="2.5" fill="#9aa6b8" opacity="0.5"/>
      </g>
      <g transform="translate(0 100)">
        <circle cx="12" cy="12" r="12" fill="#00B894"/>
        <path d="M6 12 L10 16 L18 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="34" y="7" width="120" height="6" rx="3" fill="#d4dae2" opacity="0.85"/>
        <rect x="34" y="19" width="80" height="5" rx="2.5" fill="#9aa6b8" opacity="0.5"/>
      </g>
      <g transform="translate(0 150)">
        <circle cx="12" cy="12" r="12" fill="#1B2D44" stroke="#4C9AFF" stroke-width="2"/>
        <rect x="34" y="7" width="150" height="6" rx="3" fill="#9aa6b8" opacity="0.45"/>
        <rect x="34" y="19" width="100" height="5" rx="2.5" fill="#9aa6b8" opacity="0.3"/>
      </g>
      <g transform="translate(0 200)">
        <circle cx="12" cy="12" r="12" fill="#1B2D44" stroke="#4C9AFF" stroke-width="2"/>
        <rect x="34" y="7" width="130" height="6" rx="3" fill="#9aa6b8" opacity="0.45"/>
        <rect x="34" y="19" width="90" height="5" rx="2.5" fill="#9aa6b8" opacity="0.3"/>
      </g>
