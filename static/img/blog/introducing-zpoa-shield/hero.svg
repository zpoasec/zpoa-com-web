<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="0.55" stop-color="#142233"/>
      <stop offset="1" stop-color="#1B2D44"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2684FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2684FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2684FF"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB3FF"/>
      <stop offset="1" stop-color="#2684FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>

  <!-- Concentric rings -->
  <g fill="none" stroke="#4C9AFF" opacity="0.18">
    <circle cx="600" cy="320" r="240" stroke-width="1.5"/>
    <circle cx="600" cy="320" r="180" stroke-width="1.5"/>
    <circle cx="600" cy="320" r="120" stroke-width="1.5"/>
  </g>

  <!-- Shield -->
  <g transform="translate(600 320)">
    <path d="M0 -140 L120 -95 L120 30 C120 100 60 145 0 165 C-60 145 -120 100 -120 30 L-120 -95 Z"
          fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="3" opacity="0.95"/>
    <!-- Lock icon inside shield -->
    <rect x="-32" y="-10" width="64" height="55" rx="6" fill="#fff" opacity="0.95"/>
    <path d="M-22 -10 V-32 a22 22 0 0 1 44 0 V-10" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="17" r="6" fill="#0052CC"/>
    <rect x="-3" y="17" width="6" height="14" fill="#0052CC"/>
  </g>

  <text x="600" y="600" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#9ec5ff" text-anchor="middle" letter-spacing="6">Z SHIELD</text>
</svg>
