<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 762" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ZPOA Zypher VPN system architecture: unified agents connect to the zpoa-access control plane over Noise_IK, which reads/writes PostgreSQL, ClickHouse, Redis and Kafka; the data plane is a direct WireGuard mesh to a gateway and corp resources, with a DERP relay fallback">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="762" rx="16" fill="#f8fafc"/>
  <text x="34" y="42" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#0f172a">ZPOA Zypher VPN — system architecture</text>
  <text x="34" y="64" font-size="13" fill="#64748b">control plane and data plane, strictly separate · the brain carries zero traffic</text>

  <!-- ENDPOINTS -->
  <rect x="34" y="90" width="252" height="524" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="54" y="120" font-size="16" font-weight="700" fill="#0f172a">Endpoints</text>
  <text x="54" y="139" font-size="11.5" fill="#64748b">unified zpoa-agent</text>
  <rect x="52" y="152" width="216" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/><text x="68" y="174" font-size="12.5" fill="#0f172a">Laptop · Server</text>
  <rect x="52" y="194" width="216" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/><text x="68" y="216" font-size="12.5" fill="#0f172a">Mobile</text>
  <rect x="52" y="236" width="216" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/><text x="68" y="258" font-size="12.5" fill="#0f172a">K8s sidecar</text>
  <line x1="52" y1="292" x2="268" y2="292" stroke="#e2e8f0"/>
  <text x="54" y="314" font-size="10.5" font-weight="700" letter-spacing="0.7" fill="#94a3b8">AGENT MODULES</text>
  <g font-size="12.5" fill="#334155">
    <circle cx="58" cy="338" r="3" fill="#0d9488"/><text x="72" y="342">control · multi-URL failover</text>
    <circle cx="58" cy="368" r="3" fill="#0d9488"/><text x="72" y="372">wgengine + magicsock</text>
    <circle cx="58" cy="398" r="3" fill="#0d9488"/><text x="72" y="402">UDP · STUN · DERP</text>
    <circle cx="58" cy="428" r="3" fill="#0d9488"/><text x="72" y="432">MagicDNS resolver</text>
    <circle cx="58" cy="458" r="3" fill="#0d9488"/><text x="72" y="462">posture · kill switch</text>
    <circle cx="58" cy="488" r="3" fill="#0d9488"/><text x="72" y="492">SPA · eBPF filter</text>
  </g>

  <!-- CONTROL PLANE -->
  <rect x="636" y="90" width="572" height="248" rx="14" fill="rgba(13,148,136,0.05)" stroke="#0d9488" stroke-width="1.4"/>
  <text x="658" y="122" font-size="16" font-weight="700" fill="#0f172a">Control plane · zpoa-access</text>
  <text x="658" y="141" font-size="11.5" fill="#0d9488">the brain — carries zero data-plane traffic</text>
  <g>
    <rect x="658" y="160" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="722" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Coordinator</text>
    <rect x="796" y="160" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="860" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">IPAM</text><text x="860" y="200" text-anchor="middle" font-size="10" fill="#64748b">100.64.0.0/10</text>
    <rect x="934" y="160" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="998" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Policy · ACL</text><text x="998" y="200" text-anchor="middle" font-size="10" fill="#64748b">HuJSON</text>
    <rect x="1072" y="160" width="120" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="1132" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">NetworkMap</text>
    <rect x="658" y="230" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="722" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">MagicDNS</text>
    <rect x="796" y="230" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="860" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Posture</text>
    <rect x="934" y="230" width="128" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="998" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Noise_IK</text>
    <rect x="1072" y="230" width="120" height="52" rx="9" fill="#fff" stroke="#d7e0e8"/><text x="1132" y="257" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">DERP</text><text x="1132" y="271" text-anchor="middle" font-size="10" fill="#64748b">registry</text>
  </g>

  <!-- STATE LAYER -->
  <rect x="636" y="360" width="572" height="98" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="658" y="386" font-size="13" font-weight="700" fill="#0f172a">State layer</text>
  <g>
    <rect x="658" y="398" width="128" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="722" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">PostgreSQL</text><text x="722" y="433" text-anchor="middle" font-size="9.5" fill="#64748b">primary + replica</text>
    <rect x="796" y="398" width="128" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="860" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ClickHouse</text><text x="860" y="433" text-anchor="middle" font-size="9.5" fill="#64748b">telemetry 90d</text>
    <rect x="934" y="398" width="128" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="998" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Redis</text><text x="998" y="433" text-anchor="middle" font-size="9.5" fill="#64748b">cache</text>
    <rect x="1072" y="398" width="120" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1132" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Kafka</text><text x="1132" y="433" text-anchor="middle" font-size="9.5" fill="#64748b">events</text>
  </g>

  <!-- control channel edge -->
  <path d="M286 232 L636 210" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="330" y="196" font-size="11.5" font-weight="600" fill="#334155">① control channel</text>
  <text x="330" y="212" font-size="10.5" fill="#64748b">Noise_IK / HTTP-2 long-poll → NetworkMap</text>
  <!-- cp -> data -->
  <line x1="922" y1="338" x2="922" y2="360" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="936" y="352" font-size="10.5" fill="#64748b">reads / writes</text>

  <!-- DATA PLANE -->
  <text x="300" y="556" font-size="12" font-weight="700" fill="#0d9488">② data plane · WireGuard mesh — direct P2P encrypted UDP · 100.64.0.0/10</text>

  <rect x="470" y="572" width="224" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="490" y="604" font-size="15" font-weight="700" fill="#0f172a">Gateway</text>
  <text x="490" y="624" font-size="11" fill="#64748b">z-access-gateway · subnet router</text>
  <text x="490" y="641" font-size="11" fill="#64748b">advertises 10.20.0.0/16</text>

  <rect x="730" y="572" width="224" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="750" y="604" font-size="15" font-weight="700" fill="#0f172a">Corp resources</text>
  <text x="750" y="624" font-size="11" fill="#64748b">SSH · RDP · apps</text>
  <text x="750" y="641" font-size="11" fill="#64748b">10.20.0.x</text>

  <rect x="990" y="572" width="218" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="1010" y="604" font-size="15" font-weight="700" fill="#0f172a">DERP relay</text>
  <text x="1010" y="624" font-size="11" fill="#64748b">z-access-relay</text>
  <text x="1010" y="641" font-size="11" fill="#64748b">HTTPS 443 · fallback</text>

  <!-- data plane edges -->
  <path d="M286 552 L470 610" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#at)"/>
  <text x="300" y="600" font-size="11" font-weight="600" fill="#0d9488">WireGuard P2P (UDP)</text>
  <line x1="694" y1="617" x2="730" y2="617" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>
  <!-- derp fallback dashed -->
  <path d="M286 592 L286 706 L990 706 L990 664" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="470" y="722" font-size="10.5" fill="#94a3b8">NAT-blocked → encrypted DERP relay on 443</text>
</svg>
