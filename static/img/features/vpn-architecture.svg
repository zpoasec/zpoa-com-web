<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ZPOA Zypher VPN architecture: self-hosted control plane and data plane inside customer infrastructure">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker>
    <marker id="arwt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="600" rx="16" fill="#f8fafc"/>

  <!-- customer infra -->
  <rect x="205" y="34" width="875" height="548" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="228" y="60" font-size="13.5" font-weight="700" fill="#334155">CUSTOMER-OWNED INFRASTRUCTURE</text>
  <text x="470" y="60" font-size="12.5" fill="#94a3b8">self-hosted · air-gap capable · nothing leaves your boundary</text>

  <!-- control plane band -->
  <rect x="225" y="74" width="835" height="200" rx="11" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="245" y="97" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="0.5">CONTROL PLANE — coordination &amp; state · the matchmaker, never sees traffic</text>

  <!-- CP -->
  <rect x="248" y="118" width="160" height="98" rx="10" fill="#0f172a"/>
  <text x="328" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ZPOA Access CP</text>
  <text x="328" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">auth · IPAM · netmap · ACL</text>

  <!-- PG primary -->
  <rect x="470" y="118" width="150" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="545" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Postgres</text>
  <text x="545" y="179" text-anchor="middle" font-size="11" fill="#64748b">primary · read/write</text>

  <!-- PG standby -->
  <rect x="678" y="118" width="150" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="753" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Postgres</text>
  <text x="753" y="179" text-anchor="middle" font-size="11" fill="#64748b">hot standby · ~30s promote</text>

  <!-- DERP -->
  <rect x="888" y="118" width="150" height="98" rx="10" fill="#0f172a"/>
  <text x="963" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">DERP Relay</text>
  <text x="963" y="179" text-anchor="middle" font-size="11" fill="#94a3b8">encrypted fallback</text>

  <!-- CP -> primary -->
  <line x1="408" y1="167" x2="466" y2="167" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="437" y="158" text-anchor="middle" font-size="10.5" fill="#64748b">state</text>
  <!-- primary -> standby -->
  <line x1="620" y1="167" x2="674" y2="167" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwt)"/>
  <text x="647" y="158" text-anchor="middle" font-size="10.5" fill="#0d9488">stream</text>

  <!-- data plane band -->
  <rect x="225" y="300" width="835" height="256" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="245" y="323" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">DATA PLANE — WireGuard mesh · direct P2P, end-to-end encrypted, never touches the DB</text>

  <!-- subnet router -->
  <rect x="430" y="372" width="180" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="520" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Subnet Router</text>
  <text x="520" y="442" text-anchor="middle" font-size="11" fill="#64748b">advertises corp CIDRs</text>
  <text x="520" y="459" text-anchor="middle" font-size="11" fill="#64748b">10.20.0.0/16</text>

  <!-- corp servers -->
  <rect x="720" y="372" width="220" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Corp App Servers</text>
  <text x="830" y="442" text-anchor="middle" font-size="11" fill="#64748b">files · apps · RDP · SSH</text>

  <!-- subnet -> corp -->
  <line x1="610" y1="431" x2="716" y2="431" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="663" y="422" text-anchor="middle" font-size="10.5" fill="#64748b">corp LAN</text>

  <!-- client (outside) -->
  <rect x="24" y="300" width="150" height="120" rx="12" fill="#0f172a"/>
  <text x="99" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Secure Client</text>
  <text x="99" y="371" text-anchor="middle" font-size="11" fill="#94a3b8">remote / WFH</text>
  <text x="99" y="387" text-anchor="middle" font-size="11" fill="#94a3b8">laptop</text>

  <!-- control channel: client -> CP -->
  <path d="M174 330 L206 330 L206 167 L246 167" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="212" y="250" font-size="10.5" fill="#64748b">control channel</text>

  <!-- data plane: client -> subnet router -->
  <path d="M174 390 L340 390 L340 431 L428 431" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arwt)"/>
  <text x="250" y="382" font-size="11" font-weight="600" fill="#0d9488">Direct P2P WireGuard</text>

  <!-- DERP fallback -->
  <path d="M963 216 L963 340 L612 405" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="820" y="330" font-size="10.5" fill="#94a3b8">relay fallback (still encrypted)</text>
</svg>
