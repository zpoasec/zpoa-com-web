<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Direct peer-to-peer mesh: remote laptop and branch office connect straight to private resources, bypassing a central VPN gateway">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="620" rx="18" fill="#0a1119"/>
  <rect x="0" y="0" width="1120" height="620" rx="18" fill="url(#grid)"/>

  <text x="44" y="52" font-size="15" font-weight="700" fill="#f8fafc">Direct peer-to-peer mesh</text>
  <text x="44" y="74" font-size="12.5" fill="#5eead4">every device connects straight to the resource · no central choke point</text>

  <!-- subnet container -->
  <rect x="772" y="118" width="300" height="418" rx="16" fill="rgba(45,212,191,0.05)" stroke="rgba(94,234,212,0.28)"/>
  <text x="792" y="146" font-size="12.5" font-weight="700" fill="#5eead4">Subnet · 10.20.0.0/16</text>

  <!-- mesh lines -->
  <g stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
    <line x1="302" y1="221" x2="800" y2="203"/>
    <line x1="302" y1="221" x2="800" y2="313"/>
    <line x1="302" y1="221" x2="800" y2="423"/>
    <line x1="302" y1="433" x2="800" y2="203"/>
    <line x1="302" y1="433" x2="800" y2="313"/>
    <line x1="302" y1="433" x2="800" y2="423"/>
  </g>
  <g fill="#5eead4">
    <circle cx="302" cy="221" r="4"/><circle cx="302" cy="433" r="4"/>
    <circle cx="800" cy="203" r="4"/><circle cx="800" cy="313" r="4"/><circle cx="800" cy="423" r="4"/>
  </g>

  <!-- faded legacy gateway being bypassed -->
  <rect x="474" y="470" width="214" height="56" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)" stroke-dasharray="5 4"/>
  <text x="581" y="495" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">Legacy VPN gateway</text>
  <text x="581" y="513" text-anchor="middle" font-size="11" fill="#475569">bypassed · no backhaul</text>

  <!-- left: laptop -->
  <rect x="70" y="192" width="232" height="58" rx="13" fill="#ffffff"/>
  <rect x="88" y="211" width="18" height="12" rx="1.6" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="84" y1="226" x2="110" y2="226" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <text x="122" y="226" font-size="14.5" font-weight="600" fill="#0f172a">Remote laptop</text>

  <!-- left: branch -->
  <rect x="70" y="404" width="232" height="58" rx="13" fill="#ffffff"/>
  <rect x="88" y="421" width="16" height="18" rx="1.4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="92" y1="426" x2="96" y2="426" stroke="#0f172a" stroke-width="1.3"/><line x1="99" y1="426" x2="101" y2="426" stroke="#0f172a" stroke-width="1.3"/>
  <line x1="92" y1="431" x2="96" y2="431" stroke="#0f172a" stroke-width="1.3"/><line x1="99" y1="431" x2="101" y2="431" stroke="#0f172a" stroke-width="1.3"/>
  <text x="122" y="439" font-size="14.5" font-weight="600" fill="#0f172a">Branch office</text>

  <!-- right nodes -->
  <rect x="800" y="176" width="244" height="54" rx="12" fill="#ffffff"/>
  <rect x="820" y="196" width="16" height="6" rx="1.4" fill="none" stroke="#0f172a" stroke-width="1.3"/>
  <rect x="820" y="204" width="16" height="6" rx="1.4" fill="none" stroke="#0f172a" stroke-width="1.3"/>
  <text x="848" y="208" font-size="14" font-weight="600" fill="#0f172a">App server</text>

  <rect x="800" y="286" width="244" height="54" rx="12" fill="#ffffff"/>
  <rect x="820" y="303" width="15" height="15" rx="2" fill="none" stroke="#0f172a" stroke-width="1.3"/>
  <line x1="827" y1="300" x2="827" y2="303" stroke="#0f172a" stroke-width="1.2"/><line x1="827" y1="318" x2="827" y2="321" stroke="#0f172a" stroke-width="1.2"/>
  <text x="848" y="318" font-size="14" font-weight="600" fill="#0f172a">Compute</text>

  <rect x="800" y="396" width="244" height="54" rx="12" fill="#ffffff"/>
  <ellipse cx="827" cy="416" rx="7" ry="2.6" fill="none" stroke="#0f172a" stroke-width="1.3"/>
  <path d="M820 416 v9 a7 2.6 0 0 0 14 0 v-9" fill="none" stroke="#0f172a" stroke-width="1.3"/>
  <text x="848" y="428" font-size="14" font-weight="600" fill="#0f172a">Database</text>
</svg>
