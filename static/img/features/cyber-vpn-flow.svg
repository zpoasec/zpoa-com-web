<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 772" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How a device joins the mesh: Noise_IK handshake, IPAM and posture, NetworkMap build, HTTP/2 long-poll push, and a direct WireGuard tunnel with DERP fallback">
  <rect x="0" y="0" width="600" height="772" rx="16" fill="#f8fafc"/>

  <text x="34" y="44" font-size="19" font-weight="800" letter-spacing="-0.3" fill="#0f172a">How a device joins the mesh</text>
  <text x="34" y="66" font-size="12.5" fill="#64748b">control-plane handshake → policy → direct tunnel</text>

  <!-- spine -->
  <line x1="66" y1="140" x2="66" y2="700" stroke="#B8ECE4" stroke-width="2"/>

  <!-- 1 -->
  <rect x="104" y="106" width="464" height="86" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="66" cy="140" r="20" fill="#0d9488"/><text x="66" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  <text x="126" y="136" font-size="15" font-weight="700" fill="#0f172a">Authenticate</text>
  <text x="126" y="159" font-size="12" fill="#475569">Agent → Coordinator over Noise_IK (agent knows the</text>
  <text x="126" y="176" font-size="12" fill="#475569">server static pubkey), held open on HTTP/2 long-poll.</text>

  <!-- 2 -->
  <rect x="104" y="246" width="464" height="86" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="66" cy="280" r="20" fill="#0d9488"/><text x="66" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  <text x="126" y="276" font-size="15" font-weight="700" fill="#0f172a">Assign &amp; check</text>
  <text x="126" y="299" font-size="12" fill="#475569">IPAM allocates 100.64.x.x/32 from the tenant /16;</text>
  <text x="126" y="316" font-size="12" fill="#475569">device posture is evaluated before enrolment.</text>

  <!-- 3 -->
  <rect x="104" y="386" width="464" height="86" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="66" cy="420" r="20" fill="#0d9488"/><text x="66" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  <text x="126" y="416" font-size="15" font-weight="700" fill="#0f172a">Build the NetworkMap</text>
  <text x="126" y="439" font-size="12" fill="#475569">Coordinator compiles ACL-filtered peers, DERPMap,</text>
  <text x="126" y="456" font-size="12" fill="#475569">MagicDNS, and per-node FilterRules for this device.</text>

  <!-- 4 -->
  <rect x="104" y="526" width="464" height="86" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="66" cy="560" r="20" fill="#0d9488"/><text x="66" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
  <text x="126" y="556" font-size="15" font-weight="700" fill="#0f172a">Push policy</text>
  <text x="126" y="579" font-size="12" fill="#475569">The map is pushed the moment topology changes; the</text>
  <text x="126" y="596" font-size="12" fill="#475569">agent rewrites its WireGuard config straight from it.</text>

  <!-- 5 -->
  <rect x="104" y="666" width="464" height="86" rx="12" fill="#0f172a"/>
  <circle cx="66" cy="700" r="20" fill="#0f172a"/><text x="66" y="706" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
  <text x="126" y="696" font-size="15" font-weight="700" fill="#fff">Direct tunnel</text>
  <text x="126" y="719" font-size="12" fill="#cbd5e1">Traffic goes direct P2P over WireGuard (UDP). If NAT</text>
  <text x="126" y="736" font-size="12" fill="#cbd5e1">blocks it, peers fall back to a DERP relay on 443.</text>
</svg>
